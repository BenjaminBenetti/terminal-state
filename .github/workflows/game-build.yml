name: Build static game

on:
  push:
    branches: [main]
  # Pull requests into main run the whole validation, every test included, BEFORE merge (required check `build`). Plain
  # pull_request: read-only token, no secrets; never the privileged target-branch variant. Runs on main (the merged commit's push or
  # a manual run) only build, package and upload the release artifact: the tests already passed in the pull request.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-1:
    # Mall round 3 CI follow-up (user, 2026-11-01: "put it to 6 CI runners ... remove the testing from the build step"): the full
    # Vitest suite runs as SIX parallel shards on the standard runner (`vitest --shard`, whole files; game:test is the unchanged
    # full-suite command, one worker per shard as the single job had — the suite's wall-clock budgets assume it: three workers on
    # the 4-CPU public runner doubled them). Each shard proves from its JSON report that it ran its files completely without a
    # failure and publishes the list; `bundle` compiles / packages in parallel with NO tests, `checks` runs the workflow / packager
    # validators, and the required `build` is a lightweight fail-closed aggregate of all of them (tools/release/test-shards.mjs).
    # Pull requests only (user, 2026-11-11: "tests run on pull requests only"): the shards and `checks` are skipped on main, where the
    # merged change already passed them in its pull request's required `build` (branch protection: required, strict, admins enforced).
    name: test (shard 1/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=1/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 1 6 "$RUNNER_TEMP/vitest-shard.json"

  test-2:
    name: test (shard 2/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=2/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 2 6 "$RUNNER_TEMP/vitest-shard.json"

  test-3:
    name: test (shard 3/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=3/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 3 6 "$RUNNER_TEMP/vitest-shard.json"

  test-4:
    name: test (shard 4/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=4/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 4 6 "$RUNNER_TEMP/vitest-shard.json"

  test-5:
    name: test (shard 5/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=5/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 5 6 "$RUNNER_TEMP/vitest-shard.json"

  test-6:
    name: test (shard 6/6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=6/6 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 6 6 "$RUNNER_TEMP/vitest-shard.json"

  checks:
    # The workflow / pin validator and the node --test suites of the release tooling (packager, dynamic-app wrapper, shard proof).
    # Pull requests only, like the shards.
    name: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run ci:check
      - run: npm run ci:test

  bundle:
    # The compile / package / assets job: no test execution, no condition and no `needs`, so it runs for every trigger, in parallel
    # with the shards on a pull request. `npm run build` (typecheck + build) and `ci:package` (the public-input allowlist / artifact
    # policy) are the release validation that main still runs. Only runs on main itself (the exact merged commit, or a manual run on
    # main) upload the release artifacts — see the upload steps. An artifact uploaded here is not a release by itself: Main publishes
    # only the artifact of a commit whose WHOLE workflow succeeded (required check `build` included).
    name: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run ci:package
      - name: Upload static site and integrity manifest
        # Release artifacts come only from main: pull-request runs (ref refs/pull/N/merge) and manual runs from another
        # branch validate but must not become release artifacts.
        if: github.ref == 'refs/heads/main'
        # Official actions/upload-artifact v7.0.2 (node24), SHA verified with git ls-remote.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-web-${{ github.sha }}
          path: artifacts/terminal-state-web/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 30
      - name: Upload separate integrity manifest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-manifest-${{ github.sha }}
          path: artifacts/terminal-state-web/manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  build:
    # Stable check name (required status check on main): a lightweight FAIL-CLOSED aggregate. It always runs once the bundle, the
    # checks and all six shards finished (a job skipped by a failed `needs` would read as a passing required check). On a pull
    # request its first step fails unless every one of them succeeded, then the inventory step proves the shards ran every test file
    # exactly once. On main (push / manual run) the tests are skipped by design: the first step then requires the bundle to succeed
    # and the checks and every shard to be exactly `skipped`, and there is no inventory to prove.
    name: build
    needs: [bundle, checks, test-1, test-2, test-3, test-4, test-5, test-6]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the bundle, the checks and every test shard
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ needs.bundle.result }} ${{ needs.checks.result }} ${{ needs.test-1.result }} ${{ needs.test-2.result }} ${{ needs.test-3.result }} ${{ needs.test-4.result }} ${{ needs.test-5.result }} ${{ needs.test-6.result }}
        run: |
          echo "$EVENT: bundle checks test-1..6: $RESULTS"
          if [ "$EVENT" = 'pull_request' ]; then
            [ "$RESULTS" = 'success success success success success success success success' ] || { echo "::error::the bundle, the checks and every test shard must succeed (got: $RESULTS)"; exit 1; }
          else
            [ "$RESULTS" = 'success skipped skipped skipped skipped skipped skipped skipped' ] || { echo "::error::$EVENT runs build and package only: the bundle must succeed with the checks and every test shard skipped (got: $RESULTS)"; exit 1; }
          fi
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Prove the shards ran the whole test inventory
        if: github.event_name == 'pull_request'
        env:
          SHARD_1_FILES: ${{ needs.test-1.outputs.files }}
          SHARD_1_TESTS: ${{ needs.test-1.outputs.tests }}
          SHARD_1_SKIPPED: ${{ needs.test-1.outputs.skipped }}
          SHARD_1_SKIPPED_FILES: ${{ needs.test-1.outputs.skippedFiles }}
          SHARD_2_FILES: ${{ needs.test-2.outputs.files }}
          SHARD_2_TESTS: ${{ needs.test-2.outputs.tests }}
          SHARD_2_SKIPPED: ${{ needs.test-2.outputs.skipped }}
          SHARD_2_SKIPPED_FILES: ${{ needs.test-2.outputs.skippedFiles }}
          SHARD_3_FILES: ${{ needs.test-3.outputs.files }}
          SHARD_3_TESTS: ${{ needs.test-3.outputs.tests }}
          SHARD_3_SKIPPED: ${{ needs.test-3.outputs.skipped }}
          SHARD_3_SKIPPED_FILES: ${{ needs.test-3.outputs.skippedFiles }}
          SHARD_4_FILES: ${{ needs.test-4.outputs.files }}
          SHARD_4_TESTS: ${{ needs.test-4.outputs.tests }}
          SHARD_4_SKIPPED: ${{ needs.test-4.outputs.skipped }}
          SHARD_4_SKIPPED_FILES: ${{ needs.test-4.outputs.skippedFiles }}
          SHARD_5_FILES: ${{ needs.test-5.outputs.files }}
          SHARD_5_TESTS: ${{ needs.test-5.outputs.tests }}
          SHARD_5_SKIPPED: ${{ needs.test-5.outputs.skipped }}
          SHARD_5_SKIPPED_FILES: ${{ needs.test-5.outputs.skippedFiles }}
          SHARD_6_FILES: ${{ needs.test-6.outputs.files }}
          SHARD_6_TESTS: ${{ needs.test-6.outputs.tests }}
          SHARD_6_SKIPPED: ${{ needs.test-6.outputs.skipped }}
          SHARD_6_SKIPPED_FILES: ${{ needs.test-6.outputs.skippedFiles }}
        run: node tools/release/test-shards.mjs inventory 6
