name: Build static game

on:
  push:
    branches: [main]
  # Pull requests into main run the same validation BEFORE merge (required check `build`). Plain pull_request:
  # read-only token, no secrets; never the privileged target-branch variant.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-1:
    # Mall round 3 CI follow-up (user choice B, 2026-11-01): the full Vitest suite runs as THREE parallel shards on the standard
    # runner (`vitest --shard`, whole files; game:test is the unchanged full-suite command). Each shard proves from its JSON report that
    # it ran its files completely without a failure and publishes the list; the required `build` job fails unless all three shards
    # succeeded and their lists partition the whole test inventory (tools/release/test-shards.mjs).
    name: test (shard 1/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=1/3 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 1 3 "$RUNNER_TEMP/vitest-shard.json"

  test-2:
    name: test (shard 2/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=2/3 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 2 3 "$RUNNER_TEMP/vitest-shard.json"

  test-3:
    name: test (shard 3/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      files: ${{ steps.shard.outputs.files }}
      tests: ${{ steps.shard.outputs.tests }}
      skipped: ${{ steps.shard.outputs.skipped }}
      skippedFiles: ${{ steps.shard.outputs.skippedFiles }}
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run game:test -- --shard=3/3 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"
      - id: shard
        run: node tools/release/test-shards.mjs verify 3 3 "$RUNNER_TEMP/vitest-shard.json"

  build:
    # Stable check name (required status check on main). Validation runs for every trigger; only runs on main itself
    # (the exact merged commit, or a manual run on main) upload release artifacts — see the upload steps.
    # Fail-closed gate: `build` always runs after the three test shards (a job skipped by a failed `needs` would read as a passing
    # required check) and its first step fails unless every shard succeeded; the inventory step then proves the shards ran every
    # test file exactly once. Release uploads come after both, from this job only.
    name: build
    needs: [test-1, test-2, test-3]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Track 2 (PR #20) set 30 min for the single-job suite (~21-29 min on the 2 vCPU private runner); the shards keep the same cap.
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Require every test shard
        env:
          SHARD_RESULTS: ${{ needs.test-1.result }} ${{ needs.test-2.result }} ${{ needs.test-3.result }}
        run: |
          echo "test shards: $SHARD_RESULTS"
          [ "$SHARD_RESULTS" = 'success success success' ] || { echo "::error::every test shard must succeed (got: $SHARD_RESULTS)"; exit 1; }
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run ci:check
      - name: Prove the shards ran the whole test inventory
        env:
          SHARD_1_FILES: ${{ needs.test-1.outputs.files }}
          SHARD_1_TESTS: ${{ needs.test-1.outputs.tests }}
          SHARD_1_SKIPPED: ${{ needs.test-1.outputs.skipped }}
          SHARD_1_SKIPPED_FILES: ${{ needs.test-1.outputs.skippedFiles }}
          SHARD_2_FILES: ${{ needs.test-2.outputs.files }}
          SHARD_2_TESTS: ${{ needs.test-2.outputs.tests }}
          SHARD_2_SKIPPED: ${{ needs.test-2.outputs.skipped }}
          SHARD_2_SKIPPED_FILES: ${{ needs.test-2.outputs.skippedFiles }}
          SHARD_3_FILES: ${{ needs.test-3.outputs.files }}
          SHARD_3_TESTS: ${{ needs.test-3.outputs.tests }}
          SHARD_3_SKIPPED: ${{ needs.test-3.outputs.skipped }}
          SHARD_3_SKIPPED_FILES: ${{ needs.test-3.outputs.skippedFiles }}
        run: node tools/release/test-shards.mjs inventory 3
      - run: npm run build
      - run: npm run ci:test
      - run: npm run ci:package
      - name: Upload static site and integrity manifest
        # Release artifacts come only from main: pull-request runs (ref refs/pull/N/merge) and manual runs from another
        # branch validate but must not become release artifacts.
        if: github.ref == 'refs/heads/main'
        # Official actions/upload-artifact v7.0.2 (node24), SHA verified with git ls-remote.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-web-${{ github.sha }}
          path: artifacts/terminal-state-web/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 30
      - name: Upload separate integrity manifest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-manifest-${{ github.sha }}
          path: artifacts/terminal-state-web/manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
