name: Build static game

on:
  push:
    branches: [main]
  # Pull requests into main run the same validation BEFORE merge (required check `build`). Plain pull_request:
  # read-only token, no secrets; never the privileged target-branch variant.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Stable check name (required status check on main). Validation runs for every trigger; only runs on main itself
    # (the exact merged commit, or a manual run on main) upload release artifacts — see the upload steps.
    name: build
    runs-on: ubuntu-24.04
    # Track3 (third level): 20 -> 45 min. The suite runs effectively one file at a time here (main 0b53b6d: npm test
    # 499 s wall for 442 s of summed file time); the mall adds several generated-world suites, and the npm cache restore
    # can stall ~10 min when the account's cache egress is over its limit (seen 2026-10-31). Same checks, more time.
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1 (node24), SHA verified with git ls-remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        # Official actions/setup-node v7.1.0 (node24), SHA verified with git ls-remote.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run ci:check
      - run: npm run build
      - run: npm test
      - run: npm run ci:test
      - run: npm run ci:package
      - name: Upload static site and integrity manifest
        # Release artifacts come only from main: pull-request runs (ref refs/pull/N/merge) and manual runs from another
        # branch validate but must not become release artifacts.
        if: github.ref == 'refs/heads/main'
        # Official actions/upload-artifact v7.0.2 (node24), SHA verified with git ls-remote.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-web-${{ github.sha }}
          path: artifacts/terminal-state-web/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 30
      - name: Upload separate integrity manifest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-state-manifest-${{ github.sha }}
          path: artifacts/terminal-state-web/manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
