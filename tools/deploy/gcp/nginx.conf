# Dedicated game VM; managed by the SemVer deployment workflow.
user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { model/gltf-binary glb; model/gltf+json gltf; }
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    server_tokens off;
    access_log off;
    # Both representations were prepared on CI; no runtime compression on the micro VM.
    gzip off;
    gzip_static on;
    gzip_vary on;
    brotli off;
    brotli_static on;
    map $uri $game_cache_control {
        default "no-cache";
        ~^/assets/index-[A-Za-z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
    }
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name @DOMAIN@;
        location ^~ /.well-known/acme-challenge/ { root /var/lib/terminal-state-acme; }
        location / { return 301 https://@DOMAIN@$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name @DOMAIN@;
        ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:2m;
        root /srv/terminal-state/current/site;
        index index.html;
        etag on;
        add_header Cache-Control $game_cache_control always;
        add_header Vary Accept-Encoding always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        error_page 503 =503 /__bandwidth_cutoff.html;
        location = /__bandwidth_cutoff.html {
            internal;
            alias /usr/share/nginx/html/terminal-state-cutoff.html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "3600" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ (^|/)\. { return 404; }
        # Compression sidecars are negotiated at the original URL only.
        location ~ \.(br|gz)$ { return 404; }
        location / {
            if (-f /var/lib/terminal-state-bandwidth/cutoff) { return 503; }
            try_files $uri $uri/ =404;
        }
    }
}
